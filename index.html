<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objetos, Dados e Assincronismo</title>
</head>
<body>
    <h1>Semana 05 - Objetos, Dados e Assincronismo</h1>

    <h2>Buscador de CEP</h2>

    <form id="form-cep">
        <input type="text" id="cep" placeholder="Digite o CEP">
        <button type="submit" id="botao-cep">Buscar CEP</button>
    </form>

    <p id="status-cep"></p>
    <dl id="resultado-cep"></dl>

    <h2>Mini Pokédex</h2>

    <form id="form-pokemon">
        <input type="text" id="pokemon" placeholder="Nome do Pokémon">
        <button type="submit" id="botao-pokemon">Buscar Pokémon</button>
    </form>

    <p id="status-pokemon"></p>
    <div id="resultado-pokemon"></div>

    <script src="app.js"></script>
</body>
</html>
